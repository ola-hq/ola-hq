name: Sync Our Polaroid PROJ Letterboxd Diary

on:
  push:
    branches: [main]
    paths:
      - 'tools.html'
      - 'tools.js'
      - 'scripts/sync-letterboxd.py'
      - 'scripts/verify-hq-release.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 7,19 * * *' # Twice daily UTC; Pages publishes branch contents separately.

permissions:
  contents: write

concurrency:
  group: polaroid-letterboxd-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public website source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify approved OLA HQ Tools baseline
        run: node scripts/verify-hq-release.mjs
      - name: Verify real Letterboxd feed parser
        run: python3 scripts/sync-letterboxd.py --self-test
      - name: Fetch public Letterboxd diary snapshot
        run: python3 scripts/sync-letterboxd.py --output /tmp/ola-letterboxd-recent.json
      - name: Preserve last verified RSS data on transient feed failures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          latest_path=Path('/tmp/ola-letterboxd-recent.json')
          published_path=Path('data/letterboxd-recent.json')
          latest=json.loads(latest_path.read_text(encoding='utf-8'))
          assert latest.get('account')=='ourpolaroidproj'
          assert latest.get('status') in ('ok','unavailable')
          assert isinstance(latest.get('entries'),list)
          if latest['status']=='ok':
              # Real records from the public feed, even if no recent ratings were posted.
              published_path.parent.mkdir(parents=True,exist_ok=True)
              published_path.write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print("Real Letterboxd RSS: "+str(len(latest['entries']))+" rated entries.")
          elif published_path.exists():
              previous=json.loads(published_path.read_text(encoding='utf-8'))
              if previous.get('status')=='ok':
                  print("::warning::Feed unreachable; preserving the previous VERIFIED Letterboxd snapshot.")
              else:
                  print("::warning::Feed unreachable; keeping the existing unavailable status.")
          else:
              # Publish an explicit empty state rather than a missing file or invented films.
              published_path.parent.mkdir(parents=True,exist_ok=True)
              published_path.write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print("::warning::Feed unreachable and no previous verified snapshot exists.")
          PY
      - name: Publish verified snapshot into single Pages source branch
        run: |
          if git diff --quiet -- data/letterboxd-recent.json && git ls-files --error-unmatch data/letterboxd-recent.json >/dev/null 2>&1; then
            echo "Letterboxd snapshot unchanged. Automatic Pages build will continue serving it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/letterboxd-recent.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh Our Polaroid PROJ public Letterboxd snapshot"
          git push origin HEAD:main
