name: Deploy OLA HQ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7,19 * * *' # Twice daily, UTC. Refresh public Letterboxd diary without writing to main.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify OLA HQ release integrity
        run: node scripts/verify-hq-release.mjs
      - name: Verify public Letterboxd RSS parser
        run: python3 scripts/sync-letterboxd.py --self-test
      - name: Generate recent Letterboxd diary snapshot
        run: python3 scripts/sync-letterboxd.py
      - name: Confirm Letterboxd snapshot status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/letterboxd-recent.json').read_text(encoding='utf-8'))
          assert data.get('account') == 'ourpolaroidproj'
          if data.get('status') == 'ok':
              print(f"Pulled {len(data.get('entries', []))} recent public Letterboxd ratings.")
          else:
              print("::warning::Our Polaroid PROJ public RSS was unreachable. Site will show a source-specific empty state, not invented ratings.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
