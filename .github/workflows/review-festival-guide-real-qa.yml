name: Review Only - Real Festival Guide Screenshots
on:
  push:
    branches: [review/festival-guide-real-qa-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: |
          mkdir -p /tmp/guide-qa
          npm install --no-save --no-package-lock --prefix /tmp/guide-qa playwright-core@1.56.0
          command -v google-chrome
      - name: Run the REAL full Festival Guide in Chromium
        env:
          QA_LABEL: ${{ github.sha }}
        run: |
          mkdir -p screenshots
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/guide-web.log 2>&1 &
          sleep 2
          cat > /tmp/real-guide-qa.cjs <<'JS'
          const { chromium } = require('/tmp/guide-qa/node_modules/playwright-core');
          const fs = require('fs');
          (async()=>{
           const browser = await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH || '/usr/bin/google-chrome',args:['--no-sandbox']});
           const tests = [];
           const reports = [];
           const changed = process.env.GITHUB_SHA || 'unknown';
           const label = process.env.QA_LABEL || 'guide';
           for(const width of [360,400,1440]) for(const lang of ['en','es']) {
            const ctx = await browser.newContext({viewport:{width,height:920},deviceScaleFactor:1,serviceWorkers:'block'});
            const page = await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            const url='http://127.0.0.1:8765/la-ola-de-amor/scan/guide/?lang='+lang+'#tornaboda';
            await page.goto(url,{waitUntil:'domcontentloaded'});
            await page.locator('#tornaboda').waitFor({state:'visible',timeout:15000});
            await page.evaluate(()=>document.fonts.ready);
            await page.waitForTimeout(600);
            const metrics=await page.evaluate(()=>{
             const cardInfo=(sel)=>{
              const card=document.querySelector(sel), b=card.getBoundingClientRect();
              const tops=[...card.children].map(el=>({text:el.textContent.trim().slice(0,55),top:el.getBoundingClientRect().top-b.top,bottom:el.getBoundingClientRect().bottom-b.top}));
              const cs=getComputedStyle(card),before=getComputedStyle(card,'::before'),after=getComputedStyle(card,'::after');
              const topH=parseFloat(before.height), botH=parseFloat(after.height);
              return {cardHeight:b.height,topH,botH,paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,topClearance:Math.min(...tops.map(t=>t.top))-topH,bottomClearance:b.height-botH-Math.max(...tops.map(t=>t.bottom)),children:tops};
             };
             const back=document.querySelector('.masthead>a'), b=back.getBoundingClientRect(), masthead=document.querySelector('.masthead').getBoundingClientRect();
             const xOverflow=[...document.querySelectorAll('body *')].filter(el=>{let r=el.getBoundingClientRect();return r.width>0 && (r.right>innerWidth+2||r.left< -2) && getComputedStyle(el).position!=='absolute';}).slice(0,8).map(el=>el.tagName+'.'+String(el.className).slice(0,55));
             return {pathname:location.pathname,hash:location.hash,lang:document.documentElement.lang,backHref:back.getAttribute('href'),brandImg:back.querySelector('img')?.getAttribute('src')||null,backAccessibleText:back.innerText,backBBox:{left:b.left,right:b.right,width:b.width},mastheadBBox:{left:masthead.left,right:masthead.right},documentOverflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,xOverflow,dayOneHidden:document.querySelector('#today').hidden,dayTwoVisible:!document.querySelector('#tornaboda').hidden,saturdayMap:document.querySelector('.tornaboda-map-open img')?.getAttribute('src'),easy:document.querySelector('#tornaboda [data-i18n="easyAfternoon"]').textContent,night:document.querySelector('#tornaboda [data-i18n="nightTakesUs"]').textContent,activity:cardInfo('#tornaboda .saturday-activities'),afterFive:cardInfo('#tornaboda .after-five')};
            });
            metrics.width=width; metrics.language=lang; metrics.errors=errors;
            const prefix='screenshots/'+label+'-'+width+'-'+lang;
            await page.screenshot({path:prefix+'-REAL-full-page.png',fullPage:true,animations:'disabled'});
            const box = await page.locator('#tornaboda .saturday-activities').boundingBox();
            const after = await page.locator('#tornaboda .after-five').boundingBox();
            const docH=await page.evaluate(()=>document.documentElement.scrollHeight);
            const y=Math.max(0,Math.floor(box.y-260)), h=Math.min(docH-y,Math.ceil(after.y+after.height-y+260));
            await page.screenshot({path:prefix+'-REAL-surroundings.png',clip:{x:0,y,width,height:h},animations:'disabled'});
            reports.push(metrics);
            tests.push({width,lang,fullScreenshot:prefix+'-REAL-full-page.png',surroundingScreenshot:prefix+'-REAL-surroundings.png'});
            await ctx.close();
           }
           fs.writeFileSync('screenshots/metrics.json',JSON.stringify({sha:changed,shots:tests,reports},null,2));
           console.log(JSON.stringify(reports.map(r=>({width:r.width,lang:r.language,overflow:r.documentOverflow,activityClearance:[r.activity.topClearance,r.activity.bottomClearance],afterFiveClearance:[r.afterFive.topClearance,r.afterFive.bottomClearance],branding:r.brandImg,route:r.hash,errors:r.errors})),null,2));
           const baseErrors=reports.filter(r=>r.documentOverflow>2||r.errors.length||!r.dayTwoVisible||!r.dayOneHidden||r.backHref!=='../../#/chapter/guadalajara'||r.hash!=='#tornaboda');
           if(baseErrors.length) throw new Error('Base integrated route / visual invariants failed: '+JSON.stringify(baseErrors.map(r=>({width:r.width,lang:r.language,overflow:r.documentOverflow,errors:r.errors,href:r.backHref}))));
           if(reports[0].brandImg){
            const failures=reports.filter(r=>r.activity.topClearance<1||r.activity.bottomClearance<1||r.afterFive.topClearance<1||r.afterFive.bottomClearance<1||!r.brandImg);
            if(failures.length)throw new Error('Text clearance failed: '+JSON.stringify(failures.map(r=>({width:r.width,lang:r.language,activity:[r.activity.topClearance,r.activity.bottomClearance],after:[r.afterFive.topClearance,r.afterFive.bottomClearance]}))));
           }
           await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/real-guide-qa.cjs
      - name: Upload genuine screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: festival-guide-real-${{ github.sha }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn
