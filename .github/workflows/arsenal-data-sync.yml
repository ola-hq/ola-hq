name: Refresh Arsenal Wave matchday
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/arsenal-sync.mjs'
      - 'scripts/arsenal-sync.test.mjs'
      - 'data/arsenal-2026.json'
      - '.github/workflows/arsenal-data-sync.yml'

permissions:
  contents: write

concurrency:
  group: arsenal-data-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Arsenal parser and fallback tests
        run: node --test scripts/arsenal-sync.test.mjs
      - name: Refresh Arsenal fixture and table cache
        if: github.event_name != 'pull_request'
        run: node scripts/arsenal-sync.mjs
      - name: Commit verified snapshot to public main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/arsenal-2026.json; then
            echo "No Arsenal data changed."
            exit 0
          fi
          git config user.name "ola-hq-arsenal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arsenal-2026.json
          git commit -m "data: refresh Arsenal matchday snapshot"
          git push origin HEAD:main
