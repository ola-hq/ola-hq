name: Sync Arsenal Wave Premier League Scores

on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/arsenal-scores-sync.mjs'
      - 'scripts/arsenal-scores-sync.test.mjs'
      - '.github/workflows/arsenal-scores-sync.yml'
  pull_request:
    paths:
      - 'arsenal-wave.html'
      - 'arsenal-scores.js'
      - 'arsenal-navigation.js'
      - 'arsenal-scores.css'
      - 'scripts/arsenal-scores-sync.mjs'
      - 'scripts/arsenal-scores-sync.test.mjs'
      - '.github/workflows/arsenal-scores-sync.yml'

permissions:
  contents: write

concurrency:
  group: arsenal-scores-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend and score sync
        run: |
          node --check arsenal-scores.js
          node --check arsenal-navigation.js
          node --check arsenal.js
          node --test scripts/arsenal-scores-sync.test.mjs
      - name: Pull official scores and verified match details
        if: github.event_name != 'pull_request'
        run: node scripts/arsenal-scores-sync.mjs
      - name: Publish score snapshot when changes are meaningful
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          bash scripts/commit-data.sh data/arsenal-scores.json 'data: sync Arsenal Wave league scores'
