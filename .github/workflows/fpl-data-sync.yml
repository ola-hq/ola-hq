name: Refresh FPL Draft Hub data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fpl-sync.mjs'
      - 'scripts/validate-fpl.mjs'
      - '.github/workflows/fpl-data-sync.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-data-sync
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current canonical public source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release and FPL failure handling
        run: |
          node scripts/verify-hq-release.mjs
          node --test scripts/fpl-sync.test.mjs
      - name: Fetch validated FPL snapshot atomically
        run: node scripts/fpl-sync.mjs
      - name: Commit data only; publisher handles workflow completion
        run: |
          bash scripts/commit-data.sh data/fpl/league-18767.json 'data: refresh FPL Draft Hub snapshot'
