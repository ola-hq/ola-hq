name: Refresh FPL Draft Hub data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fpl-wave.html'
      - 'fpl.css'
      - 'fpl-hub.js'
      - 'scripts/fpl-sync.mjs'
      - '.github/workflows/fpl-data-sync.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-data-sync
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fetch and sanitize FPL Draft data
        run: node scripts/fpl-sync.mjs
      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- data/fpl/league-18767.json; then
            echo "No FPL data changes."
          else
            git config user.name "ola-hq-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/fpl/league-18767.json
            git commit -m "Update FPL Draft snapshot"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload current site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
