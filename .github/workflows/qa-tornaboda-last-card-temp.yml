name: TEMP - Tornaboda last-card QA
on:
  push:
    branches: [review/festival-guide-real-qa-20261009]
    paths: [.github/workflows/qa-tornaboda-last-card-temp.yml]
permissions:
  contents: read
jobs:
  compare-real-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chrome driver
        run: |
          mkdir -p /tmp/ola-qa
          npm install --no-package-lock --no-save --prefix /tmp/ola-qa playwright-core@1.56.0
      - name: Compare the real last card before and after
        run: |
          mkdir -p screens
          cat > /tmp/last-card-qa.cjs <<'JS'
          const {chromium}=require('/tmp/ola-qa/node_modules/playwright-core');
          const fs=require('fs');
          (async()=>{
           const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
           const all=[];
           for(const width of [360,400,1440]) for(const lang of ['en','es']){
            const ctx=await browser.newContext({viewport:{width,height:width===1440?920:960},deviceScaleFactor:1,serviceWorkers:'block'});
            const page=await ctx.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:'+process.env.PORT+'/la-ola-de-amor/scan/guide/?lang='+lang+'#tornaboda',{waitUntil:'domcontentloaded'});
            await page.locator('#tornaboda').waitFor({state:'visible'});
            await page.evaluate(()=>document.fonts.ready);
            await page.waitForTimeout(220);
            const sel='#tornaboda > .section-intro:last-child';
            await page.locator(sel).scrollIntoViewIfNeeded();
            await page.evaluate(()=>scrollBy({top:-100,behavior:'instant'}));
            const d=await page.evaluate(selector=>{
             const el=document.querySelector(selector),box=el.getBoundingClientRect(),css=getComputedStyle(el),
               before=getComputedStyle(el,'::before'),after=getComputedStyle(el,'::after');
             const children=[...el.children].filter(x=>x.matches('a')).map(x=>({text:x.textContent.trim(),href:x.getAttribute('href'),bounds:(()=>{const r=x.getBoundingClientRect();return {top:r.top-box.top,bottom:r.bottom-box.top,x:r.x,right:r.right};})()}));
             const nearest=document.querySelector('#tornaboda .after-five');
             const nearby={background:getComputedStyle(nearest).backgroundImage,bottomBandHeight:getComputedStyle(nearest,'::after').height,bottomPattern:getComputedStyle(nearest,'::after').backgroundSize,topPattern:getComputedStyle(nearest,'::before').backgroundSize};
             return {url:location.href,locale:document.documentElement.lang,
              width:innerWidth,documentWidth:document.documentElement.scrollWidth,
              bottomCardHeight:box.height,topBandHeight:before.height,topBandPattern:before.backgroundSize,
              bottomBandHeight:after.height,bottomBandPattern:after.backgroundSize,
              topBandPosition:before.position,bottomBandPosition:after.position,
              cardPaddingTop:css.paddingTop,cardPaddingBottom:css.paddingBottom,
              cardBackground:css.backgroundImage,
              children,nearby,hasImage:before.backgroundImage.includes('tile.svg')&&after.backgroundImage.includes('tile.svg')};
            },sel);
            const name='screens/'+process.env.VERSION+'-'+width+'-'+lang;
            await page.screenshot({path:name+'-viewport.png',fullPage:false,animations:'disabled'});
            await page.locator(sel).screenshot({path:name+'-last-card.png',animations:'disabled'});
            const record={...d,version:process.env.VERSION,lang,width,errors};
            all.push(record);
            if(record.documentWidth>width+1 || errors.length || record.children.length!==2 ||record.children[0].href!=='#updates'||record.children[1].href!=='#today')throw Error('Original routing or overflow failed '+JSON.stringify(record));
            if(process.env.VERSION==='AFTER'){
             const topH=parseFloat(d.topBandHeight),bottomH=parseFloat(d.bottomBandHeight);
             if(!d.hasImage||d.bottomBandPosition!=='absolute'||!Number.isFinite(topH)||!Number.isFinite(bottomH)
                ||parseFloat(d.cardPaddingTop)<topH+15||parseFloat(d.cardPaddingBottom)<bottomH+15
                ||d.children.some(x=>x.bounds.top<topH+5||x.bounds.bottom>d.bottomCardHeight-bottomH-5)
                ||d.bottomBandPattern!==d.nearby.bottomPattern)
              throw Error('Final Talavera band mismatch '+JSON.stringify(record));
            }
            await ctx.close();
           }
           fs.writeFileSync('screens/'+process.env.VERSION+'-metrics.json',JSON.stringify(all,null,2));
           console.log('QA_PASS_'+process.env.VERSION,JSON.stringify(all.map(x=>({width:x.width,lang:x.lang,topBand:x.topBandHeight,bottomBand:x.bottomBandHeight,bottomPattern:x.bottomBandPattern,neighborPattern:x.nearby.bottomPattern,cardPaddingTop:x.cardPaddingTop,cardPaddingBottom:x.cardPaddingBottom,documentWidth:x.documentWidth,errors:x.errors})),null,2));
           await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          git fetch --depth=1 origin 5e3900d0743b3a85353fb3d9db917ad73f389715
          git worktree add --detach /tmp/ola-prior-review 5e3900d0743b3a85353fb3d9db917ad73f389715
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ola-updated.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory /tmp/ola-prior-review >/tmp/ola-before.log 2>&1 &
          sleep 2
          PORT=8766 VERSION=BEFORE node /tmp/last-card-qa.cjs
          PORT=8765 VERSION=AFTER node /tmp/last-card-qa.cjs
      - name: Upload true browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tornaboda-final-card-real-browser-before-after
          path: screens/
          retention-days: 14
